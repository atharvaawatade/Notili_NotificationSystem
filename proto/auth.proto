syntax = "proto3";

package auth;
option go_package = "github.com/appointy/notli/proto/auth";

service AuthService {
  // ValidateAPIKey validates an API key and returns information about the associated user
  rpc ValidateAPIKey(APIKeyValidationRequest) returns (APIKeyValidationResponse) {}
}

message APIKeyValidationRequest {
  string api_key = 1;
}

message APIKeyValidationResponse {
  bool valid = 1;
  string user_id = 2;
  string email = 3;
  string error = 4;
}
